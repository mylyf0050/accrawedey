<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>City Builder</title>
<style>
:root{
  --glass:rgba(16,24,36,.62); --stroke:rgba(255,255,255,.10);
  --text:#eaf1f8; --muted:#9db0c3; --gold:#fbbf24;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0b1220;color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#wrap{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);
  box-shadow:0 10px 34px rgba(0,0,0,.35)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

#top{position:absolute;left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;pointer-events:none}
#top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px}
#brand b{font-size:15px;letter-spacing:.01em}
#brand .muted{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
#sun{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7c2,#fbbf24);box-shadow:0 0 12px #fbbf24;transition:background .6s,box-shadow .6s}
#sun.night{background:radial-gradient(circle at 60% 40%,#fff,#c7d2fe);box-shadow:0 0 12px #a5b4fc}
#stats{gap:20px}
.stat{display:flex;align-items:center;gap:9px}
.stat i{width:4px;height:30px;border-radius:3px;background:var(--c)}
.stat span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat b{font-size:17px;font-variant-numeric:tabular-nums;font-weight:650}
.stat small{display:block;font-size:11px;color:#7ee0a1;font-variant-numeric:tabular-nums}
.meter{width:54px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:4px}
.meter div{height:100%;width:0;background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80);transition:width .5s}
#warn{display:none;color:#fda4af;font-size:13px;gap:8px;border-color:rgba(248,113,113,.35)}
#reset{border:1px solid var(--stroke);font-size:13px;color:var(--muted);transition:all .15s}
#reset:hover{color:#fff;background:rgba(255,255,255,.1)}
#reset.armed{background:#b91c1c;color:#fff;border-color:#f87171}

#dock{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:8px;border-radius:22px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock .sep{width:1px;background:var(--stroke);margin:6px 4px;flex:none}
.tool{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 10px 7px;border-radius:15px;background:transparent;border:1px solid transparent;color:var(--muted);transition:background .15s,box-shadow .15s,transform .1s,opacity .2s}
.tool svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool span{font-size:11px;font-weight:650;color:var(--text)}
.tool em{font-style:normal;font-size:10px;color:var(--gold);min-height:12px;font-variant-numeric:tabular-nums}
.tool:hover{background:rgba(255,255,255,.08)}
.tool:active{transform:scale(.96)}
.tool.on{color:#fff;background:linear-gradient(160deg,rgba(90,176,255,.38),rgba(124,92,255,.38));border-color:rgba(140,170,255,.55);box-shadow:0 0 20px rgba(96,150,255,.38)}
.tool.cant{opacity:.42}

#zoom{position:absolute;right:calc(12px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:18px}
#zoom button{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--text)}
#zoom button:hover{background:rgba(255,255,255,.1)}
#zoom svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#hint{position:absolute;left:50%;top:88px;transform:translateX(-50%);padding:14px 18px;border-radius:16px;max-width:min(92%,430px);text-align:center;font-size:14px;line-height:1.5;pointer-events:none;transition:opacity .4s}
#hint b{color:#9ad1ff}
#hint small{display:block;color:var(--muted);margin-top:4px}
#toast{position:absolute;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translate(-50%,10px);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;background:rgba(127,29,29,.72);border-color:rgba(248,113,113,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* phones: blur is expensive under a moving canvas, so use a solid glass tint instead */
@media (pointer:coarse){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(16,24,36,.80)}
  #zoom button{width:44px;height:44px}
}
body.lite .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(16,24,36,.84)}
@media (max-width:720px){
  #top{gap:8px}
  #stats{order:-1;flex:1 1 100%;justify-content:space-between;gap:10px;padding:8px 12px}
  .stat b{font-size:15px}.meter{width:38px}
  #brand{order:1;padding:6px 12px}#brand b{display:none}
  #warn{order:2}
  #reset{order:3;margin-left:auto;padding:10px 16px;min-height:40px;font-size:13px}
  #hint{top:130px}
  #dock{left:8px;right:8px;transform:none;justify-content:space-between;padding:6px;max-width:none;border-radius:20px}
  .tool{min-width:0;flex:1;padding:8px 2px 6px}.tool span{font-size:10px}.tool em{font-size:9px}
  #dock .sep{margin:6px 0}
}
@media (max-height:520px){
  #hint{display:none}.tool span{display:none}.tool{padding:8px 8px 6px}
  #top{top:calc(6px + env(safe-area-inset-top))}.pill{padding:5px 10px}.stat span{display:none}.stat i{height:22px}
  #brand{display:none}
  #dock{bottom:calc(6px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(78px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="top">
  <div class="glass pill" id="brand"><span id="sun"></span><b>My City</b><span class="muted" id="clock">09:00</span></div>
  <div class="glass pill" id="stats">
    <div class="stat" style="--c:#fbbf24"><i></i><div><span>Money</span><b id="vMoney">0</b></div><small id="vIncome"></small></div>
    <div class="stat" style="--c:#60a5fa"><i></i><div><span>Residents</span><b id="vPop">0</b></div></div>
    <div class="stat" style="--c:#a78bfa"><i></i><div><span>Jobs</span><b id="vJobs">0</b></div></div>
    <div class="stat" style="--c:#4ade80"><i></i><div><span>Happy</span><b id="vHappy">0%</b><div class="meter"><div id="barHappy"></div></div></div></div>
  </div>
  <div class="glass pill" id="warn"></div>
  <button class="glass pill" id="reset">New City</button>
</div>

<div id="hint" class="glass">Pick <b>Road</b>, drag a line across the grass, then add <b>Houses</b> and <b>Shops</b> beside it.<small>Money arrives every day from residents and shop jobs. Bulldozing refunds half.</small></div>
<div id="toast" class="glass"></div>
<div id="zoom" class="glass">
  <button id="zin" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zout" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zhome" title="Center"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg></button>
</div>
<div id="dock" class="glass"></div>

<script>
// =====================================================
// MODEL: pure game logic. No drawing code in this part.
// A future 3D renderer reads this same data unchanged.
// =====================================================
const N = 64;
const TYPES = {
  empty: { cost: 0,  label: 'Bulldoze' },
  road:  { cost: 5,  label: 'Road' },
  house: { cost: 50, label: 'House' },
  shop:  { cost: 80, label: 'Shop' },
  park:  { cost: 30, label: 'Park' }
};

const model = {
  grid: Array.from({ length: N }, () => Array(N).fill('empty')),
  money: 800,
  day: 0
};

function nearRoad(x, y) {
  return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => model.grid[y + dy]?.[x + dx] === 'road');
}

// place() returns '' on success, otherwise a short reason string.
function place(x, y, type) {
  if (x < 0 || y < 0 || x >= N || y >= N) return 'out';
  if (model.grid[y][x] === type) return 'same';
  if (type !== 'empty' && model.money < TYPES[type].cost)
    return `Not enough money: ${TYPES[type].label} costs ${TYPES[type].cost}, you have ${Math.floor(model.money)}`;
  const prev = model.grid[y][x];
  if (type === 'empty' && prev !== 'empty') model.money += Math.floor(TYPES[prev].cost / 2); // 50% refund
  model.money -= TYPES[type].cost;
  model.grid[y][x] = type;
  return '';
}

function stats() {
  let pop = 0, jobs = 0, parks = 0, built = 0, unconnected = 0, roads = 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const t = model.grid[y][x];
    if (t !== 'empty') built++;
    if (t === 'road') roads++;
    if (t === 'house') { if (nearRoad(x, y)) pop += 4; else unconnected++; }
    if (t === 'shop')  { if (nearRoad(x, y)) jobs += 3; else unconnected++; }
    if (t === 'park') parks++;
  }
  const employed = Math.min(pop, jobs);
  const happiness = pop ? Math.min(100, Math.round(40 + parks * 4 + (employed / pop) * 40)) : 0;
  // Residents pay tax, employed residents and shop jobs earn more, and a small
  // town grant means the player can never get stuck at zero income.
  const income = Math.max(3, pop * 0.5 + employed * 2 + jobs / 3);
  return { pop, jobs, employed, parks, happiness, income, built, unconnected, roads };
}

function step() {
  model.money += stats().income;
  model.day++;
}

function save() {
  try { localStorage.setItem('cb-save-v3', JSON.stringify(model)); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('cb-save-v3'));
    if (d && d.grid && d.grid.length === N) Object.assign(model, d);
  } catch (e) {}
}

// =====================================================
// RENDERER (2D isometric). Swap this section for 3D later.
// Everything below only READS the model above.
// =====================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TW = 64, TH = 32;                          // tile size at zoom 1
const DPR0 = Math.min(window.devicePixelRatio || 1, 2);
let DPR = DPR0;                                  // lowered automatically on slow devices
const START_TILE_PX = 72;
const DAY_SECONDS = 100;                          // one full day/night cycle
let cam = { x: 0, y: 0, z: (START_TILE_PX / TW) * DPR };
let hover = null, tool = 'road', timeShift = 0;
let NIGHT = 0, WINDOW = '#bfdcf0', ghost = false;
let S = stats();
const born = new Map(), cars = [], parts = [];
let lights = [], lite = 0;                       // 0 full quality, 1 effects off, 2 lower resolution + 30 fps

// ---------- helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
function hash(x, y) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
const shadeCache = new Map();
function shade(hex, f) {
  const k = hex + f; let r = shadeCache.get(k);
  if (r) return r;
  const n = parseInt(hex.slice(1), 16), c = v => clamp(Math.round(v * f), 0, 255);
  r = `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
  shadeCache.set(k, r); return r;
}
function mixHex(a, b, t) {
  const p = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`;
}
const easeOutBack = a => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(a - 1, 3) + c1 * Math.pow(a - 1, 2); };

function toScreen(gx, gy) {
  return [(gx - gy) * TW / 2 * cam.z + cam.x, (gx + gy) * TH / 2 * cam.z + cam.y];
}
function toGrid(sx, sy) {
  const dx = (sx - cam.x) / cam.z / (TW / 2);
  const dy = (sy - cam.y) / cam.z / (TH / 2);
  return [Math.floor((dx + dy) / 2), Math.floor((dy - dx) / 2)];
}
function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * DPR));
  canvas.height = Math.max(1, Math.round(r.height * DPR));
  clampCamera();
}
function centerCamera() {
  cam.z = (START_TILE_PX / TW) * DPR;
  cam.x = canvas.width / 2;
  cam.y = canvas.height / 2 - N * TH / 2 * cam.z - 16 * DPR;
}
// Keep the centre of the view inside the map so the player can never lose the city,
// while still being able to reach every corner at any zoom.
function clampCamera() {
  const W = canvas.width, H = canvas.height;
  const dx = (W / 2 - cam.x) / cam.z / (TW / 2);
  const dy = (H / 2 - cam.y) / cam.z / (TH / 2);
  const u = (dx + dy) / 2, v = (dy - dx) / 2;
  const cu = clamp(u, 0, N), cv = clamp(v, 0, N);
  if (cu !== u || cv !== v) {
    cam.x = W / 2 - (cu - cv) * TW / 2 * cam.z;
    cam.y = H / 2 - (cu + cv) * TH / 2 * cam.z;
  }
}

// ---------- drawing primitives ----------
function poly(pts, fill, edge) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (edge) { ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1; ctx.stroke(); }
}
function diamond(x, y, color, s = 1) {
  const hw = TW / 2 * cam.z * s, hh = TH / 2 * cam.z * s, cx = x, cy = y + TH / 2 * cam.z;
  poly([[cx, cy - hh], [cx + hw, cy], [cx, cy + hh], [cx - hw, cy]], color);
}
function box(x, y, h, color, s = 0.78) {
  const hw = TW / 2 * cam.z * s, hh = TH / 2 * cam.z * s, H = h * cam.z, cx = x, cy = y + TH / 2 * cam.z;
  poly([[cx - hw, cy - H], [cx, cy + hh - H], [cx, cy + hh], [cx - hw, cy]], shade(color, 0.86), true);
  poly([[cx + hw, cy - H], [cx, cy + hh - H], [cx, cy + hh], [cx + hw, cy]], shade(color, 0.64), true);
  poly([[cx, cy - hh - H], [cx + hw, cy - H], [cx, cy + hh - H], [cx - hw, cy - H]], shade(color, 1.08), true);
}
// quads drawn ON a wall: u runs along the wall (0..1), v runs up it (0..1)
function leftQuad(cx, cy, hw, hh, H, u0, u1, v0, v1, color) {
  const x0 = cx - hw + u0 * hw, y0 = cy + u0 * hh, x1 = cx - hw + u1 * hw, y1 = cy + u1 * hh;
  poly([[x0, y0 - v1 * H], [x1, y1 - v1 * H], [x1, y1 - v0 * H], [x0, y0 - v0 * H]], color);
}
function rightQuad(cx, cy, hw, hh, H, u0, u1, v0, v1, color) {
  const x0 = cx + u0 * hw, y0 = cy + hh - u0 * hh, x1 = cx + u1 * hw, y1 = cy + hh - u1 * hh;
  poly([[x0, y0 - v1 * H], [x1, y1 - v1 * H], [x1, y1 - v0 * H], [x0, y0 - v0 * H]], color);
}
function hull(pts) {                              // convex hull (monotone chain)
  pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
function shadowOf(sx, sy, height, s) {            // light comes from the top-left
  const z = cam.z, hw = TW / 2 * z * s, hh = TH / 2 * z * s, cx = sx, cy = sy + TH / 2 * z;
  const dx = height * 0.55 * z, dy = height * 0.26 * z, pts = [];
  for (const [ox, oy] of [[0, 0], [dx, dy]]) pts.push([cx + ox, cy - hh + oy], [cx + hw + ox, cy + oy], [cx + ox, cy + hh + oy], [cx - hw + ox, cy + oy]);
  poly(hull(pts), 'rgba(10,25,20,.24)');
}

// ---------- palette ----------
const GRASS = ['#79b265', '#72ab5f', '#80b96a', '#6ea45c'];
const WALLS = ['#f6e7cc', '#eccdb4', '#d9e8d3', '#ecd6df'];
const ROOFS = ['#c8553d', '#8d5b45', '#4f7090', '#a34c5d'];
const SHOP_WALL = ['#e1eaf6', '#f5e8d1', '#e3f1e9'];
const AWN = [['#e11d48', '#fff1f2'], ['#2563eb', '#eff6ff'], ['#059669', '#ecfdf5']];
const CAR_COLORS = ['#ef4444', '#3b82f6', '#f59e0b', '#10b981', '#e5e7eb', '#a855f7', '#f97316'];
const isRoad = (x, y) => model.grid[y]?.[x] === 'road';

// ---------- tiles ----------
function drawRoadTile(x, y, sx, sy) {
  const z = cam.z, hw = TW / 2 * z, hh = TH / 2 * z, cx = sx, cy = sy + hh;
  diamond(sx, sy, '#444c58', 1.04);
  const ur = isRoad(x, y - 1), dr = isRoad(x + 1, y), dl = isRoad(x, y + 1), ul = isRoad(x - 1, y);
  const f = 0.93, ax = hw * f, ay = hh * f;
  ctx.lineWidth = Math.max(1.5, 3 * z); ctx.strokeStyle = '#cdd2da'; ctx.lineCap = 'butt';
  ctx.beginPath();
  if (!ur) { ctx.moveTo(cx, cy - ay); ctx.lineTo(cx + ax, cy); }
  if (!dr) { ctx.moveTo(cx + ax, cy); ctx.lineTo(cx, cy + ay); }
  if (!dl) { ctx.moveTo(cx, cy + ay); ctx.lineTo(cx - ax, cy); }
  if (!ul) { ctx.moveTo(cx - ax, cy); ctx.lineTo(cx, cy - ay); }
  ctx.stroke();
  const qx = hw / 2, qy = hh / 2;
  ctx.strokeStyle = '#f1f3f6'; ctx.lineWidth = Math.max(1, 1.8 * z); ctx.setLineDash([5 * z, 5 * z]);
  ctx.beginPath();
  if (ur) { ctx.moveTo(cx, cy); ctx.lineTo(cx + qx, cy - qy); }
  if (dr) { ctx.moveTo(cx, cy); ctx.lineTo(cx + qx, cy + qy); }
  if (dl) { ctx.moveTo(cx, cy); ctx.lineTo(cx - qx, cy + qy); }
  if (ul) { ctx.moveTo(cx, cy); ctx.lineTo(cx - qx, cy - qy); }
  ctx.stroke(); ctx.setLineDash([]);
}

function drawTree(sx, sy, h, scale) {
  const z = cam.z, s = scale * z;
  const cx = sx + (((h >> 3) % 21) - 10) / 100 * TW * z, cy = sy + TH / 2 * z + (((h >> 7) % 13) - 6) / 100 * TH * z;
  const sway = Math.sin(performance.now() / 900 + h) * 0.6 * s;
  ctx.fillStyle = '#6b4a2f'; ctx.fillRect(cx - 1.4 * s, cy - 7 * s, 2.8 * s, 7 * s);
  if (h & 1) {                                           // pine
    const cols = ['#2f7d46', '#38904f', '#45a35b'];
    for (let i = 0; i < 3; i++) {
      const by = cy - (4 + i * 7) * s, w = (14 - i * 3.4) * s, ht = 11 * s, tx = cx + sway * (i + 1) / 3;
      poly([[cx - w / 2, by], [cx + w / 2, by], [tx, by - ht]], cols[i]);
    }
  } else {                                               // round
    ctx.fillStyle = '#3b8f4e'; ctx.beginPath(); ctx.arc(cx + sway * .5, cy - 15 * s, 9.5 * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#56ab62'; ctx.beginPath(); ctx.arc(cx - 2.5 * s + sway * .5, cy - 18 * s, 6.2 * s, 0, 7); ctx.fill();
  }
}
function treeShadow(sx, sy, h, scale) {
  const z = cam.z, s = scale * z;
  const cx = sx + (((h >> 3) % 21) - 10) / 100 * TW * z, cy = sy + TH / 2 * z + (((h >> 7) % 13) - 6) / 100 * TH * z;
  ctx.fillStyle = 'rgba(10,25,20,.22)'; ctx.beginPath(); ctx.ellipse(cx + 5 * s, cy + 1 * s, 9 * s, 3.8 * s, 0, 0, 7); ctx.fill();
}

function zoomAt(sx, sy, factor) {
  const nz = clamp(cam.z * factor, 0.3 * DPR, 2.6 * DPR), f = nz / cam.z;
  cam.x = sx - (sx - cam.x) * f; cam.y = sy - (sy - cam.y) * f; cam.z = nz; clampCamera();
}

canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, pos(e));
  lastPointerType = e.pointerType;
  if (pointers.size === 2) { painting = false; panning = false; tap = null; lastPinch = null; return; }
  last = pos(e);
  if (e.button === 1 || e.button === 2 || tool === 'pan' || spaceDown) { panning = true; canvas.style.cursor = 'grabbing'; return; }
  // Touch + building tools: a TAP places, a DRAG moves the map. Road and Bulldoze paint while dragging.
  if (e.pointerType === 'touch' && (tool === 'house' || tool === 'shop' || tool === 'park')) { tap = { x: e.clientX, y: e.clientY }; return; }
  painting = true;
  const [gx, gy] = toGrid(...pos(e));
  tryPlace(gx, gy, true);
});
canvas.addEventListener('pointermove', e => {
  const p = pos(e); hover = toGrid(...p);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
  if (tap && pointers.size === 1) {
    if (Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 10) return;
    tap = null; panning = true; last = p; return;
  }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()], mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (lastPinch) { cam.x += mid[0] - lastPinch.mid[0]; cam.y += mid[1] - lastPinch.mid[1]; zoomAt(mid[0], mid[1], dist / lastPinch.dist); }
    lastPinch = { mid, dist };
  } else if (panning && last) {
    cam.x += p[0] - last[0]; cam.y += p[1] - last[1]; last = p; clampCamera();
  } else if (painting) {
    const [gx, gy] = toGrid(...p); tryPlace(gx, gy, false);
  }
});
function release(e) {
  const wasTap = tap && e.type === 'pointerup' && pointers.size === 1;
  pointers.delete(e.pointerId);
  if (wasTap) { const [gx, gy] = toGrid(...pos(e)); tryPlace(gx, gy, true); }
  tap = null;
  if (e.pointerType === 'touch') hover = null;
  if (pointers.size < 2) lastPinch = null;
  if (pointers.size === 0) { painting = false; panning = false; canvas.style.cursor = tool === 'pan' ? 'grab' : 'crosshair'; save(); }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', () => { hover = null; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); const [sx, sy] = pos(e); zoomAt(sx, sy, e.deltaY < 0 ? 1.1 : 1 / 1.1); }, { passive: false });

window.addEventListener('keydown', e => {
  const k = e.key, st = 60 * DPR, keys = { 1: 'road', 2: 'house', 3: 'shop', 4: 'park', 5: 'empty', 6: 'pan' };
  if (k === ' ') { spaceDown = true; e.preventDefault(); return; }
  if (keys[k]) { selectTool(keys[k]); return; }
  if (k === 'ArrowLeft' || k === 'a') cam.x += st; else if (k === 'ArrowRight' || k === 'd') cam.x -= st;
  else if (k === 'ArrowUp' || k === 'w') cam.y += st; else if (k === 'ArrowDown' || k === 's') cam.y -= st;
  else if (k === '+' || k === '=') zoomAt(canvas.width / 2, canvas.height / 2, 1.25);
  else if (k === '-' || k === '_') zoomAt(canvas.width / 2, canvas.height / 2, 1 / 1.25);
  else return;
  clampCamera();
});
window.addEventListener('keyup', e => { if (e.key === ' ') spaceDown = false; });
window.addEventListener('resize', resize);
$('zin').onclick = () => zoomAt(canvas.width / 2, canvas.height / 2, 1.25);
$('zout').onclick = () => zoomAt(canvas.width / 2, canvas.height / 2, 1 / 1.25);
$('zhome').onclick = centerCamera;

// New City: two clicks to confirm (the browser's confirm() box is blocked in some previews).
let resetArmed = 0;
$('reset').onclick = () => {
  const b = $('reset');
  if (!resetArmed) {
    b.textContent = 'Sure? Click again'; b.classList.add('armed');
    resetArmed = setTimeout(() => { resetArmed = 0; b.textContent = 'New City'; b.classList.remove('armed'); }, 3000);
  } else {
    clearTimeout(resetArmed); resetArmed = 0; b.textContent = 'New City'; b.classList.remove('armed');
    model.grid = Array.from({ length: N }, () => Array(N).fill('empty'));
    model.money = 800; model.day = 0; cars.length = 0; born.clear(); hintGone = false;
    $('hint').style.opacity = 1; centerCamera(); save(); refreshStats();
  }
};

if (matchMedia('(pointer:coarse)').matches) $('hint').innerHTML = 'Tap <b>Road</b> below and drag across the grass, then tap to place <b>Houses</b> and <b>Shops</b> beside it.<small>Drag the map to move it, or use two fingers to move and zoom.</small>';
setTimeout(() => { $('hint').style.opacity = 0; }, 15000);

load();
resize();
centerCamera();
refreshStats();
setInterval(() => { step(); refreshStats(); save(); }, 1000);
requestAnimationFrame(frame);
</script>
</body>
</html>
