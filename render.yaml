services:
  - type: web
    name: accra-city
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: city-data
      mountPath: /data
      sizeGB: 1
